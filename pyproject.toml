[project]
name = "projections-v2"
version = "0.1.0"
description = "Maintainable NBA minutes prediction pipeline scaffolding."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Daniel Schrengost" }
]
dependencies = [
  # Native numeric stack is a common source of hard crashes (SIGSEGV/abort) under load.
  # Keep upper bounds to avoid silently rolling PROD onto bleeding-edge wheels.
  "numpy>=1.26,<2.0",
  "pandas>=2.2,<2.3",
  "scipy>=1.11,<1.16",
  "scikit-learn>=1.5,<1.7",
  "xgboost>=2.0",
  "torch>=2.2",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "prefect==3.6.7",
  "lightgbm>=4.6.0",
  "pandera>=0.26.1",
  "cvxpy>=1.7.3",
  "ortools>=9.11",
  "pyarrow>=10.0.1,<22.0",
  "tabula>=1.0.5",
  "httpx>=0.28.1",
  "tabula-py>=2.10.0",
  "pypdf2>=3.0.1",
  "fastapi>=0.115.5",
  "uvicorn>=0.38.0",
  "pulp>=2.8",
  "requests>=2.32.5",
  "duckdb>=1.4.2",
  "mlflow>=3.7.0",
  "python-multipart>=0.0.21",
  "unidecode (>=1.4.0,<2.0.0)",
  "beautifulsoup4 (>=4.14.3,<5.0.0)",
  "lxml (>=6.0.2,<7.0.0)",
  "repomix>=0.3.4",
  "nba_api>=1.4",
  "playwright>=1.57.0",
  "jpype1>=1.6.0",
  "tqdm>=4.67.3",
  "pytorch-tabular>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["projections"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.2",
  "ruff>=0.5"
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
