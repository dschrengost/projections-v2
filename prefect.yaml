- name: minutes-retrain-pipeline
  version: null
  tags: []
  concurrency_limit: 1
  description: Weekly recency retrain for Minutes V1 plus head-to-head evaluation against current production bundle.
  entrypoint: prefect_flows/minutes_retrain.py:minutes_retrain_flow
  parameters:
    season: 2025
    train_start_date: null
    train_end_date: null
    cal_start_date: null
    cal_end_date: null
    train_window_days: 120
    cal_window_days: 14
    half_life_days: 35.0
    train_random_state: 42
    allow_guard_failure: true
    run_head_to_head_eval: true
    current_bundle_dir: null
    assess_quality_gates: true
    block_on_quality_gate_failure: false
    eval_candidate_variant: "retrain_occupancy_v0"
    adaptive_thresholds_enabled: true
    adaptive_lookback_runs: 20
    adaptive_min_history_runs: 6
    adaptive_iqr_multiplier: 1.5
    adaptive_threshold_cap_multiplier: 3.0
    drift_override_enabled: true
    drift_override_relax_multiplier: 1.25
    drift_override_min_trigger_metrics: 2
    drift_override_iqr_multiplier: 1.5
    min_eval_rows_per_slice: 1000
    max_weighted_brier_delta: 0.005
    max_weighted_false_active_delta: 0.01
    max_weighted_mae_p50_cond_delta: 0.1
    max_weighted_mae_p50_cond_delta_soft: 0.4
    max_slice_brier_delta: 0.01
    max_slice_false_active_delta: 0.015
    max_slice_mae_p50_cond_delta: 0.2
    max_slice_mae_p50_cond_delta_soft: 0.6
    max_abs_p10_coverage_delta: 0.04
    max_abs_p90_coverage_delta: 0.02
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "0 10 * * 2"
      timezone: "America/New_York"

