# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: projections-v2
prefect-version: 3.6.7

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /home/daniel/prod/projections-v2

# the deployments section allows you to provide configuration for deploying flows
deployments:
- name: nba-live-pipeline
  version: null
  tags: []
  concurrency_limit: 1
  concurrency_options:
    collision_strategy: CANCEL_NEW
  description: Canonical end-to-end NBA live pipeline (v3 GameTransformerV2 path).
  entrypoint: prefect_flows/live_nba_pipeline_v3.py:nba_live_pipeline_v3_flow
  parameters:
    placeholder_mode: false
    promote_pointers: true
    replay_mode: false
    gtv2_apply_props_uplift: false
    gtv2_props_uplift_scope: all_players
    gtv2_apply_propless_tail_calibration: false
    gtv2_apply_mid_minutes_tail_calibration: false
    gtv2_apply_team_implied_points_reconcile: true
    gtv2_team_implied_points_reconcile_alpha: 0.75
    gtv2_team_implied_points_reconcile_deadband_points: 2.0
    gtv2_apply_world_realism_controls: true
    # Default: auto-select inference backend; `config/gtv2_inference_server.json`
    # controls whether Triton is considered enabled.
    gtv2_inference_backend: auto
    gtv2_device: cuda:0
    gtv2_triton_timeout_seconds: 600.0
    gtv2_world_chunk_size: 5000
    gtv2_make_model_mode: beta_binomial_all
    gtv2_make_model_use_learned_efficiency: true
    require_action_props: true
    allow_rotowire_props_fallback: true
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
        PYTHONFAULTHANDLER: "1"
        ARROW_NUM_THREADS: "1"
        OMP_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
        MALLOC_ARENA_MAX: "2"
  schedules:
    - cron: "*/15 8-10 * * *"
      timezone: "America/New_York"
    - cron: "*/15 11-21 * * *"
      timezone: "America/New_York"
    - cron: "0,15,30 22 * * *"
      timezone: "America/New_York"

