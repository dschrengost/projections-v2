# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: projections-v2
prefect-version: 3.6.7

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /home/daniel/prod/projections-v2

# the deployments section allows you to provide configuration for deploying flows
deployments:
- name: nba-live-pipeline
  version: null
  tags: []
  concurrency_limit: 1
  concurrency_options:
    collision_strategy: CANCEL_NEW
  description: Canonical end-to-end NBA live pipeline (Prefect-only control plane).
  entrypoint: prefect_flows/live_nba_pipeline.py:nba_live_pipeline_flow
  parameters: {}
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
        PYTHONFAULTHANDLER: "1"
        ARROW_NUM_THREADS: "1"
        OMP_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
        MALLOC_ARENA_MAX: "2"
  schedules:
    - cron: "*/5 8-23 * * *"
      timezone: "America/New_York"

- name: boxscores-etl
  version: null
  tags: []
  concurrency_limit: 1
  description: Scrape yesterday's NBA boxscores for evaluation/labels (Prefect-only scheduler).
  entrypoint: prefect_flows/boxscores_etl.py:boxscores_etl_flow
  parameters: {}
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "30 3 * * *"
      timezone: "America/New_York"

- name: minutes-labels-refresh
  version: null
  tags: []
  concurrency_limit: 1
  description: Refresh gold/labels_minutes_v1 partitions from latest available date to yesterday.
  entrypoint: prefect_flows/minutes_labels_refresh.py:minutes_labels_refresh_flow
  parameters:
    start_date: null
    end_date: null
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "40 3 * * *"
      timezone: "America/New_York"

- name: nightly-eval
  version: null
  tags: []
  concurrency_limit: 1
  description: Nightly prediction accuracy evaluation (FPTS + ownership).
  entrypoint: prefect_flows/nightly_eval.py:nightly_eval_flow
  parameters: {}
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "30 5 * * *"
      timezone: "America/New_York"

- name: minutes-retrain-pipeline
  version: null
  tags: []
  concurrency_limit: 1
  description: Weekly recency retrain for Minutes V1 plus head-to-head evaluation against current production bundle.
  entrypoint: prefect_flows/minutes_retrain.py:minutes_retrain_flow
  parameters:
    season: 2025
    train_start_date: null
    train_end_date: null
    cal_start_date: null
    cal_end_date: null
    train_window_days: 120
    cal_window_days: 14
    half_life_days: 35.0
    train_random_state: 42
    allow_guard_failure: true
    run_head_to_head_eval: true
    current_bundle_dir: null
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "0 10 * * 2"
      timezone: "America/New_York"

- name: rates-training-base-refresh
  version: null
  tags: []
  concurrency_limit: 1
  description: Refresh gold/rates_training_base partitions from latest available date to yesterday.
  entrypoint: prefect_flows/rates_training_base_refresh.py:rates_training_base_refresh_flow
  parameters:
    start_date: null
    end_date: null
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "5 4 * * *"
      timezone: "America/New_York"

- name: rates-retrain-pipeline
  version: null
  tags: []
  concurrency_limit: 1
  description: Biweekly rates retrain pipeline (weekly schedule with biweekly gate), calibration diagnostics, head-to-head guardrails, and auto-promotion.
  entrypoint: prefect_flows/rates_retrain.py:rates_retrain_flow
  parameters:
    run_id: null
    train_window_days: 365
    cal_window_days: 14
    val_window_days: 14
    recency_half_life_days: 75.0
    feature_set: "stage5_fta_tracking"
    run_tag: "rates_v1_stage5_recency_h75"
    refresh_training_base: true
    run_calibration_diagnostics: true
    calibration_window_days: 28
    evaluate_head_to_head: true
    auto_promote: true
    max_avg_mae_delta: 0.0
    max_head_mae_regression: 0.001
    allow_guardrail_failure: false
    biweekly_gate_enabled: true
    biweekly_anchor_date: "2026-02-03"
    normal_slice_start: null
    normal_slice_end: null
    chaos_slice_start: null
    chaos_slice_end: null
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "0 10 * * 2"
      timezone: "America/New_York"

- name: rates-calibration-monitor
  version: null
  tags: []
  concurrency_limit: 1
  description: Weekly rates calibration diagnostics on the current production run.
  entrypoint: prefect_flows/rates_retrain.py:rates_calibration_monitor_flow
  parameters:
    run_id: null
    calibration_window_days: 28
    lookback_days: 120
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "0 9 * * 2"
      timezone: "America/New_York"

