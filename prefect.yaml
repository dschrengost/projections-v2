# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: projections-v2
prefect-version: 3.6.7

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /home/daniel/prod/projections-v2

# the deployments section allows you to provide configuration for deploying flows
deployments:
- name: nba-live-pipeline
  version: null
  tags: []
  concurrency_limit: 1
  concurrency_options:
    collision_strategy: CANCEL_NEW
  description: Canonical end-to-end NBA live pipeline (Prefect-only control plane).
  entrypoint: prefect_flows/live_nba_pipeline.py:nba_live_pipeline_flow
  parameters: {}
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
        PYTHONFAULTHANDLER: "1"
        ARROW_NUM_THREADS: "1"
        OMP_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
        MALLOC_ARENA_MAX: "2"
  schedules:
    - cron: "*/5 8-23 * * *"
      timezone: "America/New_York"

- name: boxscores-etl
  version: null
  tags: []
  concurrency_limit: 1
  description: Scrape yesterday's NBA boxscores for evaluation/labels (Prefect-only scheduler).
  entrypoint: prefect_flows/boxscores_etl.py:boxscores_etl_flow
  parameters: {}
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "30 3 * * *"
      timezone: "America/New_York"

- name: nightly-eval
  version: null
  tags: []
  concurrency_limit: 1
  description: Nightly prediction accuracy evaluation (FPTS + ownership).
  entrypoint: prefect_flows/nightly_eval.py:nightly_eval_flow
  parameters: {}
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "30 5 * * *"
      timezone: "America/New_York"

- name: gamerotation-scrape
  version: null
  tags: []
  concurrency_limit: 1
  description: Scrape NBA Stats GameRotation daily (updates rotation_v1 inputs).
  entrypoint: prefect_flows/gamerotation_scrape.py:gamerotation_scrape_flow
  parameters: {}
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "15 4 * * *"
      timezone: "America/New_York"

- name: rotation-priors-update
  version: null
  tags: []
  concurrency_limit: 1
  description: Build rotation_v1 + rotation_priors_v1 after gamerotation scrape.
  entrypoint: prefect_flows/rotation_priors_update.py:rotation_priors_update_flow
  parameters:
    overwrite_rotation_v1: false
    retry_quarantined: true
    clean_priors: false
    priors_windows: null
  work_pool:
    name: projections-local
    work_queue_name: null
    job_variables:
      env:
        PROJECTIONS_DATA_ROOT: /home/daniel/projections-data
  schedules:
    - cron: "45 4 * * *"
      timezone: "America/New_York"
